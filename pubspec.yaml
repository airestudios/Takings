name: profit_track
description: Local-first reseller profit, goal and threshold tracker.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.3.0
  google_mobile_ads: ^9.1.0
  fl_chart: ^1.2.0
  intl: ^0.20.2
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  local_auth: ^3.0.2
  url_launcher: ^6.3.2
  app_links: ^7.2.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^11.0.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
